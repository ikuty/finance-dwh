# finance-dwh のローカル/本番共通の compose。
#
#   postgres  : raw 層(file_fdw)を含む DWH の DB。通電枠のあいだ起動しっぱなし。
#   transform : dbt を実行する使い捨てコンテナ（`docker compose run --rm transform ...`）。
#
# 設定は同ディレクトリの .env（.env.example 参照）から。少なくとも LAKE_DIR を指定すること。
#   ローカル : LAKE_DIR=/tmp/lake-sample（テスト用の合成ツリー）
#   Mac Mini : LAKE_DIR=/home/ikuty/finance-lake/data

name: finance-dwh

services:
  postgres:
    build:
      context: ../postgres
    image: finance-dwh-postgres:latest
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-finance}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-finance}"
      POSTGRES_DB: "${POSTGRES_DB:-finance_dwh}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - "${PGDATA_DIR:-../data/pgdata}:/var/lib/postgresql/data"
      - "${LAKE_DIR:?LAKE_DIR を .env で指定してください}:/lake:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finance} -d ${POSTGRES_DB:-finance_dwh}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  transform:
    build:
      context: ..
      dockerfile: transform/Dockerfile
    image: finance-dwh-transform:latest
    environment:
      DBT_TARGET: "${DBT_TARGET:-prod}"
      DBT_HOST: postgres
      DBT_PORT: "5432"
      DBT_USER: "${POSTGRES_USER:-finance}"
      DBT_PASSWORD: "${POSTGRES_PASSWORD:-finance}"
      DBT_DBNAME: "${POSTGRES_DB:-finance_dwh}"
      # landing への日付単位 load（edinet_csv_fdw.py --date を叩く）
      LAKE_ROOT: /lake
      LANDING_LOOKBACK_DAYS: "${LANDING_LOOKBACK_DAYS:-7}"
      # レポート公開・通知（未設定なら該当ステップをスキップ）
      S3_BUCKET_NAME: "${S3_BUCKET_NAME:-}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-ap-northeast-1}"
      SLACK_WEBHOOK_URL: "${SLACK_WEBHOOK_URL:-}"
    volumes:
      - "${LAKE_DIR:?LAKE_DIR を .env で指定してください}:/lake:ro"
      # ローカル開発でモデル・フローを編集→即再実行できるよう上書きマウント。
      - ../dbt:/app/dbt
      - ../transform/flows:/app/flows
      - ../transform/report:/app/report
      - ../postgres/fdw/edinet_csv_fdw.py:/app/fdw/edinet_csv_fdw.py:ro
    depends_on:
      postgres:
        condition: service_healthy
    # 常駐しない。`docker compose run --rm transform build` 等で都度起動する。
    profiles: ["manual"]
