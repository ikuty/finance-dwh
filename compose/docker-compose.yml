# finance-dwh のローカル/本番共通の compose。
#
#   transform    : dbt(DuckDB) を実行する使い捨てコンテナ（`docker compose run --rm transform`）。
#                  DuckDB は組み込み型で常駐サーバを持たないため、常駐サービスは無い
#                  （Postgres 版で唯一の常駐例外だった postgres サービスは廃止した）。
#   dbt-docs-gen : dbt docs generate を実行しS3へアップロードする使い捨てコンテナ
#                  （2026-10-25追加。transformと同一イメージ・同一環境変数・同一
#                  ボリュームを共用するため、x-transform-commonで重複を避ける。
#                  サービスチェーンの最後（finance-dwh-transform完了後）に実行する
#                  想定。カタログ情報の生成にはtransformで既にビルド済みのDBが
#                  必要なため、transformより前に実行してはならない）。
#   mart-transfer : dbt build後、martのParquetをikuty.com(VPS)へ転送する使い捨てコンテナ
#                  （2026-10-31追加。transformと同一イメージだが、martは読み取り専用で
#                  マウントし、レイク・dbt等は不要なため独自のvolumes/environmentを持つ。
#                  サービスチェーンはtransform → mart-transfer → dbt-docs-gen）。
#
# 設定は同ディレクトリの .env（.env.example 参照）から。少なくとも LAKE_DIR を指定すること。
#   ローカル : LAKE_DIR=/tmp/fdwh-lake（テスト用のサンプルツリー）
#   Mac Mini : LAKE_DIR=/home/ikuty/finance-lake/data

name: finance-dwh

x-transform-common: &transform-common
  build:
    context: ..
    dockerfile: transform/Dockerfile
  image: finance-dwh-transform:latest
  environment:
    DUCKDB_PATH: /data/finance_dwh.duckdb
    LANDING_ROOT: /data/landing
    CLEANSED_ROOT: /data/cleansed
    INTERMEDIATE_ROOT: /data/intermediate
    MART_ROOT: /data/mart
    LAKE_ROOT: /lake
    LANDING_LOOKBACK_DAYS: "${LANDING_LOOKBACK_DAYS:-7}"
    DBT_TARGET: "${DBT_TARGET:-prod}"
    # レポート公開・通知（未設定なら該当ステップをスキップ）
    S3_BUCKET_NAME: "${S3_BUCKET_NAME:-}"
    AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
    AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
    AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-ap-northeast-1}"
    SLACK_WEBHOOK_URL: "${SLACK_WEBHOOK_URL:-}"
    # Prefectのephemeralサーバ起動タイムアウト既定値(20秒)はMac Mini実機でギリギリ
    # （実測20〜21秒）で、2026-09-14に3回連続でRuntimeError: Timed out while
    # attempting to connect to ephemeral Prefect API serverとして実際に失敗した。
    # 60秒へ緩和する（他の設定はデフォルトのまま）。
    PREFECT_SERVER_EPHEMERAL_STARTUP_TIMEOUT_SECONDS: "60"
  volumes:
    - "${LAKE_DIR:?LAKE_DIR を .env で指定してください}:/lake:ro"
    # .duckdb カタログ・landing・cleansed の Parquet はここに永続化される（HDD 側）。
    - "${DATA_DIR:-../data}:/data"
    # ローカル開発でモデル・フローを編集→即再実行できるよう上書きマウント。
    - ../dbt:/app/dbt
    - ../transform/flows:/app/flows
    - ../transform/report:/app/report
    - ../transform/fdw:/app/fdw:ro
  # 常駐しない。`docker compose run --rm <service>` 等で都度起動する。
  profiles: ["manual"]

services:
  transform:
    <<: *transform-common

  dbt-docs-gen:
    <<: *transform-common
    entrypoint: ["python", "-m", "flows.dbt_docs_gen"]

  mart-transfer:
    image: finance-dwh-transform:latest
    entrypoint: ["python", "-m", "flows.mart_transfer"]
    environment:
      MART_ROOT: /data/mart
      MART_TRANSFER_HOST: "${MART_TRANSFER_HOST:-}"
      MART_TRANSFER_USER: "${MART_TRANSFER_USER:-martsync}"
      MART_TRANSFER_PORT: "${MART_TRANSFER_PORT:-22}"
      SLACK_WEBHOOK_URL: "${SLACK_WEBHOOK_URL:-}"
    volumes:
      - "${DATA_DIR:-../data}/mart:/data/mart:ro"
      # 転送用の秘密鍵(id_ed25519)とknown_hosts。git管理外、ホスト側で用意する。
      - "${MART_TRANSFER_SSH_DIR:-../.ssh-mart-transfer}:/ssh:ro"
    profiles: ["manual"]
