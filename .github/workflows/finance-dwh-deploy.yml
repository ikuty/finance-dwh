name: finance-dwh - Deploy to Mac Mini

# 設計: docs/deployment_design.md
# workflow_dispatch による手動トリガーのみ。Mac Mini は電源スケジュールで稼働時間が
# 限られているため、電源投入・Tailscale 経由での到達性をユーザーが確認してから実行する。
#
# Secrets は finance-lake の deploy と同種（別リポジトリなので登録は別途必要）:
#   TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET  … Tailscale OAuth クライアント（tags: tag:ci）
#   SSH_PRIVATE_KEY                        … Mac Mini への SSH 秘密鍵
#   MAC_MINI_HOST / MAC_MINI_USER          … Tailscale ホスト名 / SSH ユーザー名（= ikuty）

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Pull image and sync repo checkout on Mac Mini
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.MAC_MINI_HOST }}
          username: ${{ secrets.MAC_MINI_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # compose / systemd はレジストリ接頭辞の無いローカルタグ（finance-dwh-transform:latest）
          # を参照するため、pull 後に同じタグへ付け替える
          # （edinet-dl で実機確認済みの同種の不具合対策）。
          # git pull も併せて行い、Mac Mini 上の compose ファイル・systemd unit テンプレート・
          # dbt プロジェクトを最新に保つ（detached HEAD にはせず main のまま fast-forward）。
          script: |
            cd /home/${{ secrets.MAC_MINI_USER }}/finance-dwh
            git checkout main
            git pull origin main
            docker pull ghcr.io/${{ github.repository_owner }}/finance-dwh-transform:latest
            docker tag ghcr.io/${{ github.repository_owner }}/finance-dwh-transform:latest finance-dwh-transform:latest

# docker compose run --rm 方式（コンテナ内にデーモンを置かない）のため、pull 後の再起動や
# サービス再読み込みは不要。次回の systemd タイマー実行から新しいイメージが使われる。
