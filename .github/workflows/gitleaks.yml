name: Gitleaks

# 設計: docs/deployment_design.md「秘密情報の継続的なチェック（gitleaks）」
# main への push で実行。公開リポジトリなら無料で動作し、追加の認証情報は不要
# （private の場合は GITLEAKS_LICENSE が必要）。過去履歴の遡及スキャンは行わない。

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth未指定(既定1)だと、gitleaks-actionがpush前後のコミット範囲を
      # git logでスキャンする際に「push前」のコミットが浅いcloneに含まれておらず
      # unknown revisionで失敗する(2026-09-22実機判明。短時間に連続してmainへ
      # merge commitをpushした際に顕在化)。個人プロジェクトの規模のため全履歴
      # 取得(fetch-depth: 0)で問題ない。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
