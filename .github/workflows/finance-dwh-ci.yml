name: finance-dwh - CI

# push（main）と pull_request で実行。Mac Mini には依存しない。
# DuckDB は組み込み型なのでサービスコンテナは不要（Postgres 版にあった
# postgres サービスコンテナは廃止。ci ターゲットは :memory: を使う）。
#   - transform（flows/report/fdw）の Python を mypy --strict + pytest
#   - dbt プロジェクトを dbt parse で構造検証（レイクの実データは無いので DB 接続はしない）
# レイクのフィクスチャを用意できたら、ここに実データでの dbt build を足す余地がある。

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev deps
        run: pip install -r requirements-dev.txt

      - name: mypy --strict
        run: mypy

      - name: pytest
        run: pytest -q

      - name: dbt parse
        working-directory: dbt
        env:
          DBT_TARGET: ci
        run: dbt parse --no-partial-parse --profiles-dir .
