name: finance_dwh
version: "1.0.0"
config-version: 2
profile: finance_dwh

require-dbt-version: [">=1.8.0", "<2.0.0"]

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  finance_dwh:
    raw:
      +schema: raw
    cleansed:
      +schema: cleansed
    intermediate:
      +schema: intermediate
    mart:
      +schema: mart

# raw    : レイクを DuckDB で直接読む view モデル（models/raw/）。
#          edinet_csv_facts だけは CSV パースが重い/DuckDB の CSV リーダーが
#          長大フィールドで失敗するため例外（下記 landing 参照）。
# landing: Prefect の load_edinet タスク（dbt の外）が書く Parquet
#          （{LANDING_ROOT}/edinet_csv_facts/file_date=*/part.parquet）。
#          dbt へは source の meta.external_location 経由で見せる
#          （models/cleansed/_cleansed__sources.yml）。
# cleansed: landing / raw から型付け・名寄せする dbt モデル。external
#          materialization で Parquet に書く（{CLEANSED_ROOT}/*.parquet）。
# intermediate: cleansedを会計基準(J-GAAP/IFRS/US GAAP)等の単位でビジネスロジックを
#          含めて加工する中間モデル（models/intermediate/）。external materialization
#          で Parquet に書く（{INTERMEDIATE_ROOT}/*.parquet）。2026-09-21、
#          複数会計基準の項目名をmart側の1つのcoalesce chainに混在させたことに起因する
#          バグ（企業自身の会計基準と無関係な値を誤って採用）を受けて導入。
#          「cleansed/intermediateの分離は具体的な痛みが出てから」という2026-09-16の
#          判断における「痛み」が具体化したケース。
# mart   : 具体的な利用目的を持つ集計モデル（models/mart/）。external
#          materialization で Parquet に書く（{MART_ROOT}/*.parquet）。
#          2026-09-20、mart__edinet__financial_indicators（銘柄×期の主要財務指標）
#          で初導入。
