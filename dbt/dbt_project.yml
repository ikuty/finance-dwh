name: finance_dwh
version: "1.0.0"
config-version: 2
profile: finance_dwh

require-dbt-version: [">=1.8.0", "<2.0.0"]

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  finance_dwh:
    cleansed:
      +schema: cleansed

# raw   : file_fdw 外部テーブルへの source 定義（models/raw/_raw__sources.yml）
# landing: 日付単位 load で作る native テーブル（Prefect の load_edinet が管理、
#          models/cleansed/_cleansed__sources.yml で source 宣言）
# cleansed: landing / raw から型付け・名寄せする dbt モデル
# mart   : 利用用途が固まってから
