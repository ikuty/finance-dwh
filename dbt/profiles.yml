# dbt の接続プロファイル。`dbt --profiles-dir dbt ...` で参照する。
# DuckDB は組み込み（サーバなし）。path はカタログ用の .duckdb ファイル。
# cleansed の大半は external materialization で別途 Parquet に出るため、この
# .duckdb ファイルは基本的に小さいスキーマ情報のみだが、cleansed__edinet__facts
# は2026-09-17よりmaterialized='incremental'（DuckDB内部テーブル）に変更した
# ため、この1テーブル分の実データ（約1.2GB相当）もここに保持される
# （post_hookで従来通りParquetへもエクスポートしている、詳細はモデル参照）。
finance_dwh:
  target: "{{ env_var('DBT_TARGET', 'prod') }}"
  outputs:
    prod:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '/data/finance_dwh.duckdb') }}"
      threads: 4
      # DuckDBの既定memory_limitは物理メモリの約80%。Mac Mini実機がメモリ7.7GBの
      # 頃、この既定動作でdbt build中にコンテナが6.49GiB(84.7%)まで膨らみ、
      # システム全体の空きメモリが189MiBまで逼迫・スワップも発生する
      # (2026-09-13のJPX形式Bメモリ逼迫障害と同種の前兆)のを実測したため、
      # OS・Docker・Prefect等の他プロセス分の余白を残して3GBに明示的に制限した
      # (2026-09-15)。2026-09-23、Mac Miniのメモリを16GBに増設したことを受けて
      # 12GB(約75%、DuckDBの既定80%に近い水準)へ引き上げる。OS・Docker・
      # Prefect等の他プロセス分の余白として約4GBを引き続き確保する。
      settings:
        memory_limit: "12GB"
    ci:
      type: duckdb
      path: ":memory:"
      threads: 4
