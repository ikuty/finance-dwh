version: 2

models:
  - name: intermediate__edinet__dei_facts
    description: >
      書類(doc_id)単位のDEI（会計基準・連結決算の有無、毎回フル rebuild、Parquet）。
      J-GAAP/IFRS/US GAAP各intermediateモデル・martの両方から参照される共通部品。
    columns:
      - name: doc_id
        data_tests: [not_null, unique]
      - name: accounting_standard
        description: "会計基準（Japan GAAP/IFRS/US GAAP等）。DEI「会計基準、DEI」由来。"
      - name: has_consolidated
        description: "連結決算の有無。DEI「連結決算の有無、DEI」由来。"
      - name: shares_outstanding
        description: "発行済株式総数（普通株式）。「株式の総数等」開示セクション由来（会計基準・連結スコープに依存しない）。"
      - name: sec_code
        description: >
          証券コード。DEI「証券コード、DEI」由来（2026-10-13追加）。REIT(投資法人)の
          sec_codeは書類一覧APIのsecCodeが常にnullのため、cleansed__edinet__report_periods
          経由の値が使えない（mart__edinet__reit_financial_indicators.sec_codeが全件
          NULLになっていた不具合の修正）。通常企業は書類一覧APIのsecCodeで足りているため
          未使用（NULLではなく値を持つ場合もあるが、report_periods側を優先する）。

  - name: intermediate__jpx__daily_prices
    description: >
      普通株式の連続日次株価（毎回フル rebuild、Parquet）。cleansed__jpx__stq_prices
      （2025-09〜、詳細日次）とcleansed__jpx__daily_ohlc（2020-01〜2025-09、簡易
      日次）を銘柄コード正規化の上で結合。重複期間はstq_prices優先。列構成は
      stq_prices優先で、daily_ohlc期間はNULL埋め。
    columns:
      - name: code
        description: "銘柄コード（4桁、daily_ohlc由来行は5桁から正規化）。"
        data_tests: [not_null]
      - name: file_date
        data_tests: [not_null]
      - name: source_model
        description: "どちらのcleansedモデル由来か（stq_prices/daily_ohlc）。"

  - name: intermediate__mufg__corporate_actions
    description: >
      cleansed__mufg__stock_splits/stock_consolidationsを統合した、銘柄×権利落ち日
      単位のコーポレートアクション・イベント（毎回フル rebuild、Parquet）。
      J-Quantsの調整係数算出方式に倣う。権利落ち日は権利付最終日の翌営業日
      （intermediate__jpx__daily_pricesの実際の取引日から検索して算出）。
    columns:
      - name: code
        data_tests: [not_null]
      - name: ex_rights_date
        description: "権利落ち日（権利付最終日の翌営業日）。株価の調整基準日。"
        data_tests: [not_null]
      - name: effective_date
        description: >
          分割・併合の効力発生日（cleansed__mufg__stock_splits/stock_consolidations
          のeffective_date由来、2026-10-04追加）。発行済株式数が実際に変わる日で、
          ex_rights_dateとは通常1〜3日ズレる。発行済株式数の調整基準日として使う
          （詳細はintermediate__jpx__daily_prices_adjustedのモデルコメント参照）。
      - name: adj_factor
        description: "調整係数（ratio_before/ratio_after、分割・併合とも統一的に算出）。"
        data_tests: [not_null]
      - name: action_type
        description: "stock_split/stock_consolidationのいずれか。"

  - name: intermediate__jpx__daily_prices_adjusted
    description: >
      intermediate__jpx__daily_pricesに、株式分割・併合の累積調整係数
      （J-Quants方式）を付与した株価（毎回フル rebuild、Parquet）。生値の全列に
      加え、cumulative_adjustment_factorと調整後OHLC/VWAP/出来高（_adjサフィックス）
      を持つ。
    columns:
      - name: code
        data_tests: [not_null]
      - name: file_date
        data_tests: [not_null]
      - name: cum_adjustment_factor
        description: "累積調整係数(権利落ち日ex_rights_date基準)。株価の調整に使う。対象期間より後に分割・併合が無ければ1.0。"
        data_tests: [not_null]
      - name: shares_cum_adjustment_factor
        description: >
          累積調整係数(分割・併合の効力発生日effective_date基準、2026-10-04追加)。
          発行済株式数の調整に使う。ex_rights_date基準のcum_adjustment_factorとは
          通常1〜3日ズレるため別列にした（詳細はモデルコメント参照）。対象期間より
          後に分割・併合が無ければ1.0。
        data_tests: [not_null]

  - name: intermediate__edinet__jgaap_financial_facts
    description: >
      書類(doc_id)単位のJ-GAAP経営指標等（19指標、毎回フル rebuild、Parquet）。
      J-GAAP名のitem_nameのみを対象とし、IFRS/US GAAPとは混在させない。
    columns:
      - name: doc_id
        data_tests: [not_null, unique]

  - name: intermediate__edinet__ifrs_financial_facts
    description: >
      書類(doc_id)単位のIFRS経営指標等（19指標、毎回フル rebuild、Parquet）。
      IFRS名のitem_nameのみを対象とし、J-GAAP/US GAAPとは混在させない。
      ordinary_income/capital/payout_ratioはIFRSに対応概念が無いため常にNULL。
    columns:
      - name: doc_id
        data_tests: [not_null, unique]

  - name: intermediate__edinet__usgaap_financial_facts
    description: >
      書類(doc_id)単位のUS GAAP経営指標等（19指標、毎回フル rebuild、Parquet）。
      US GAAP名のitem_nameのみを対象とし、J-GAAP/IFRSとは混在させない。
      対象企業数は極めて少ない（10〜14社程度）。ordinary_income/capital/payout_ratioは
      US GAAPに対応概念が無いため常にNULL。
    columns:
      - name: doc_id
        data_tests: [not_null, unique]

  - name: intermediate__edinet__reit_financial_facts
    description: >
      書類(doc_id)単位のREIT(投資法人)財務指標（毎回フル rebuild、Parquet）。
      絶対額系はEDINETの生タグ(jppfs_cor:)、1口当たり系・発行済投資口総数は
      ir-disclosure-dl経由のTDnet/JPX決算短信iXBRL(tse-re-t:)から取得する
      （EDINET側には1口当たり指標が構造化データとして存在しないため。詳細は
      モデルSQL冒頭コメント参照）。
    columns:
      - name: doc_id
        data_tests: [not_null, unique]
      - name: edinet_code
        data_tests: [not_null]
      - name: period_end
        description: "対象期間の末日(cleansed__edinet__report_periods.period_endと同じ)。"
      - name: total_assets
        description: "資産(jppfs_cor:Assets、経営指標等に相当する構造化集計タグが無いため生タグから取得)。"
      - name: net_assets
        description: "純資産(jppfs_cor:NetAssets)。"
      - name: operating_income
        description: "営業利益又は営業損失(jppfs_cor:OperatingIncome)。"
      - name: ordinary_income
        description: "経常利益又は経常損失(jppfs_cor:OrdinaryIncome)。"
      - name: income_before_tax
        description: "税引前当期純利益又は税引前当期純損失(jppfs_cor:IncomeBeforeIncomeTaxes)。"
      - name: net_income
        description: "当期純利益又は当期純損失(jppfs_cor:ProfitLoss)。"
      - name: net_income_per_unit
        description: "1口当たり利益、EPS相当(tse-re-t:NetIncomePerUnitREIT、ir-disclosure-dl経由)。EDINET側に対応タグが無い。"
      - name: net_assets_per_unit
        description: "1口当たり純資産、BPS相当(tse-re-t:NetAssetsPerUnitREIT、ir-disclosure-dl経由)。"
      - name: distribution_per_unit
        description: "1口当たり分配金、利益超過分配金を除く(tse-re-t:DistributionsPerUnitExcludingDistributionsInExcessOfProfitREIT)。"
      - name: distribution_in_excess_of_profit_per_unit
        description: "1口当たり利益超過分配金(tse-re-t:DistributionsInExcessOfProfitPerUnitREIT)。"
      - name: investment_units_outstanding
        description: "発行済投資口総数、自己投資口を含む(tse-re-t:NumberOfInvestmentUnitsIncludingTreasuryInvestmentUnitsIssuedAtEndOfPeriodREIT)。"
      - name: treasury_investment_units
        description: "自己投資口数(tse-re-t:NumberOfTreasuryInvestmentUnitsIssuedAtEndOfPeriodREIT)。"

  - name: intermediate__edinet__etf_financial_facts
    description: >
      書類(doc_id)単位のETF(上場投資信託)財務指標（毎回フル rebuild、Parquet）。
      REITと同様EDINETの生タグ(jppfs_cor:)から絶対額指標のみ取得する。1口当たり
      指標(基準価額・分配金)はTDnet/JPX決算短信がPDFのみでiXBRL化されておらず、
      市場価格が基準価額とほぼ一致する設計上の性質もあるため対象外とした
      (2026-10-18決定、詳細はモデルSQL冒頭コメント参照)。
    columns:
      - name: doc_id
        data_tests: [not_null, unique]
      - name: edinet_code
        data_tests: [not_null]
      - name: fund_code
        description: >
          ファンドコード。同一edinet_codeで複数ETFを運用する運用会社が存在するため、
          edinet_codeだけでは銘柄を一意に識別できない(REITとの違い)。
        data_tests: [not_null]
      - name: period_end
        description: "対象期間の末日(cleansed__edinet__report_periods.period_endと同じ)。"
      - name: total_assets
        description: "資産(jppfs_cor:Assets)。"
      - name: liabilities
        description: "負債(jppfs_cor:Liabilities)。"
      - name: net_assets
        description: "純資産(jppfs_cor:NetAssets)。"
      - name: operating_income
        description: "営業利益又は営業損失(jppfs_cor:OperatingIncome)。"
      - name: ordinary_income
        description: "経常利益又は経常損失(jppfs_cor:OrdinaryIncome)。"
      - name: net_income
        description: "当期純利益又は当期純損失(jppfs_cor:ProfitLoss)。税引前当期純利益に相当するタグはETFの開示に存在しない(実機確認)。"
      - name: principal
        description: "元本、投資信託(jppfs_cor:PrincipalFND)。投資信託特有の会計項目、REITには無い。"
      - name: surplus_deficit
        description: "剰余金又は欠損金（△）、投資信託(jppfs_cor:SurplusDeficitFND)。"
      - name: reserve_for_distribution
        description: "分配準備積立金、投資信託(jppfs_cor:ReserveForDistributionFND)。"
