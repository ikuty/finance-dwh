version: 2

models:
  - name: mart__edinet__financial_indicators
    description: >
      銘柄(edinet_code)×期(fiscal_year, period_type)ごとの主要財務指標（案B、毎回フル
      rebuild、Parquet）。cleansed__edinet__report_periods と、会計基準別に指標を
      抽出したintermediateモデル3種（intermediate__edinet__{jgaap,ifrs,usgaap}_
      financial_facts）を doc_id で結合して構築する。企業自身のaccounting_standardを
      優先しつつcoalesce()で1列に統合する（2026-09-21、intermediate層導入）。
    columns:
      - name: doc_id
        description: "根拠となった書類のID（同一期に複数提出があれば submit_date_time 最新の1件）。"
        data_tests: [not_null]
      - name: edinet_code
        description: "EDINETコード。"
        data_tests: [not_null]
      - name: sec_code
        description: "銘柄コード。"
      - name: filer_name
        description: "提出者名。"
      - name: fiscal_year
        description: "第N期の期数。"
        data_tests: [not_null]
      - name: period_type
        description: "annual/half/q1/q2/q3/q4/quarter。"
        data_tests: [not_null]
      - name: period_start
        description: "対象期間の開始日。"
      - name: period_end
        description: "対象期間の終了日。"
      - name: submit_date_time
        description: "書類の提出日時（開示日）。株価と組み合わせる際は決算期末日でなくこちらを基準にする（先読みバイアス回避）。"
      - name: regime
        description: "旧制度/移行期/新制度（cleansed__edinet__report_periods由来）。"
      - name: accounting_standard
        description: "会計基準（DEI「会計基準、DEI」由来。Japan GAAP/IFRS/US GAAP等）。"
      - name: has_consolidated
        description: "連結決算の有無（DEI「連結決算の有無、DEI」由来）。"
      - name: total_assets
        description: "総資産額。連結優先・個別フォールバック、J-GAAP/IFRS/US GAAPをcoalesce。"
      - name: net_assets
        description: "純資産額（IFRSは親会社所有者帰属持分）。"
      - name: equity_ratio
        description: "自己資本比率。"
      - name: ordinary_income
        description: "経常利益。IFRS/US GAAPに対応概念が無いためそれらの会計基準ではNULL。"
      - name: net_income
        description: "当期純利益（親会社株主に帰属する分を優先、無ければ当期純利益）。"
      - name: sales
        description: "売上高（業種により営業収益・経常収益等の代替項目を含む）。"
      - name: eps
        description: "1株当たり当期純利益（実績、EDINET開示の確定値。会社予想値ではない）。"
      - name: bps
        description: "1株当たり純資産額。"
      - name: roe
        description: "自己資本利益率。"
      - name: per
        description: >
          株価収益率（企業自己申告、経営指標等由来）。実績EPSベースであり、
          かぶたん・Yahoo!ファイナンス等がデフォルト表示する「予想PER」（会社発表の
          進行期業績予想EPSを使用）とは異なる点に注意（詳細はdocs/mart_indicators.md
          参照）。
      - name: operating_cf
        description: "営業活動によるキャッシュ・フロー。"
      - name: investing_cf
        description: "投資活動によるキャッシュ・フロー。"
      - name: financing_cf
        description: "財務活動によるキャッシュ・フロー。"
      - name: capital
        description: "資本金。IFRS/US GAAPに対応項目が無いためそれらの会計基準ではNULL。"
      - name: payout_ratio
        description: "配当性向。IFRS/US GAAPに対応項目が無いためそれらの会計基準ではNULL。"
      - name: shares_outstanding
        description: "発行済株式総数（普通株式）。「株式の総数等」開示由来(dei_facts)を優先し、無ければ経営指標等ベースの会計基準別coalesceにフォールバック。会計基準に依存しない項目（単位: shares）。"
      - name: diluted_eps
        description: "潜在株式調整後1株当たり当期純利益（希薄化後EPS）。"
      - name: comprehensive_income
        description: "包括利益。IFRS/US GAAPは親会社所有者/株主に帰属する分を優先し、無ければ総額にフォールバック。"
      - name: cash_and_equivalents
        description: "現金及び現金同等物の残高。"
      - name: dividend_per_share
        description: "1株当たり配当額。IFRS/US GAAP専用のitem_nameが存在せず3会計基準共通（会計基準に依存しない項目）。"

  - name: mart__jpx_edinet__disclosed_fundamentals
    description: >
      銘柄(jpx_code)×開示(doc_id)ごとの財務指標（毎回フル rebuild、Parquet）。
      mart__edinet__financial_indicatorsに銘柄コード変換(jpx_code)と、決算期末日
      時点の累積調整係数(period_end_cum_adj)を付与した薄い層。株価に依存しない
      値のみを持つ（2026-09-26、mart__jpx_edinet__daily_valuation_indicatorsとの
      責務分離により新設）。
    columns:
      - name: doc_id
        description: "根拠となった書類のID。"
        data_tests: [not_null, unique]
      - name: jpx_code
        description: "銘柄コード（JPX、4桁。sec_codeの先頭4桁）。"
      - name: edinet_code / sec_code / filer_name / fiscal_year / period_type / period_end / submit_date_time
        description: "mart__edinet__financial_indicatorsと同一（詳細はそちらのcolumn定義参照）。"
      - name: eps / bps / sales / shares_outstanding / dividend_per_share
        description: "開示された値そのまま（分割・併合調整前）。mart__edinet__financial_indicatorsと同一。"
      - name: period_end_cum_adj
        description: "決算期末日(period_end)時点（以前で直近の取引日）の累積調整係数。intermediate__jpx__daily_prices_adjusted.cum_adjustment_factorをASOF JOINで取得。"

  - name: mart__jpx_edinet__daily_valuation_indicators
    description: >
      銘柄(jpx_code)×取引日(file_date)ごとの株価評価指標（毎回フル rebuild、
      Parquet）。mart__jpx_edinet__disclosed_fundamentalsとintermediate__jpx__
      daily_prices_adjustedを結合し、株価(close)と連動して日次で変化する指標のみを
      持つ（2026-09-26、開示ベースの値はmart__jpx_edinet__disclosed_fundamentals
      へ分離）。「最新」は単に最終行、決算期末日時点のスナップショットは該当日を
      1行引くだけで得られる（2026-09-25、期grainのmart__jpx_edinet__valuation_
      indicatorsを置き換え）。
    columns:
      - name: jpx_code
        description: "銘柄コード（JPX、4桁）。"
        data_tests: [not_null]
      - name: file_date
        data_tests: [not_null]
      - name: close
        description: "当日の終値（raw、無調整。当日自身の基準なので調整不要）。"
      - name: doc_id
        description: "この取引日時点で「参照可能な最新の開示」と判定された書類のID。fiscal_year/period_type/submit_date_time等の開示メタデータや、eps/bps/sales/shares_outstanding/dividend_per_shareの無調整値が必要な場合はmart__jpx_edinet__disclosed_fundamentalsとdoc_idで結合する。"
      - name: adj_ratio
        description: "決算期末日時点の累積調整係数 ÷ 当該取引日の累積調整係数。分割・併合をまたぐ場合のEPS/BPS換算に使う。またがなければ1.0。"
      - name: eps_adjusted / bps_adjusted
        description: "adj_ratioを掛けて当該取引日の株式数基準に換算したEPS/BPS。"
      - name: shares_outstanding_adjusted
        description: "adj_ratioの逆数を掛けて当該取引日の株式数基準に換算した発行済株式数。"
      - name: pbr
        description: "株価純資産倍率＝close / bps_adjusted。"
      - name: per
        description: >
          実勢PER＝close / eps_adjusted。実績EPSベース（EDINET開示の確定値）。
          かぶたん・Yahoo!ファイナンス等がデフォルト表示する「予想PER」（会社発表の
          進行期業績予想EPSを使用）とは異なる点に注意。実データ検証（2026-09-25、
          3087）ではみんかぶの実績PER表示と一致した。予想EPSはEDINET開示に含まれず
          未対応。
      - name: market_cap
        description: "時価総額＝close × shares_outstanding_adjusted。"
      - name: psr
        description: "株価売上高倍率＝market_cap / sales。"
      - name: earnings_yield
        description: "株式益回り＝eps_adjusted / close（PERの逆数）。perと同じく実績EPSベース。"
      - name: dividend_per_share_adjusted
        description: "adj_ratioを掛けて当該取引日の株式数基準に換算した1株当たり配当額。"
      - name: dividend_yield
        description: "配当利回り＝dividend_per_share_adjusted / close。"
