version: 2

models:
  - name: mart__edinet__financial_indicators
    description: >
      銘柄(edinet_code)×期(fiscal_year, period_type)ごとの主要財務指標（案B、毎回フル
      rebuild、Parquet）。cleansed__edinet__report_periods と、会計基準別に指標を
      抽出したintermediateモデル3種（intermediate__edinet__{jgaap,ifrs,usgaap}_
      financial_facts）を doc_id で結合して構築する。企業自身のaccounting_standardを
      優先しつつcoalesce()で1列に統合する（2026-09-21、intermediate層導入）。
    columns:
      - name: doc_id
        description: "根拠となった書類のID（同一期に複数提出があれば submit_date_time 最新の1件）。"
        data_tests: [not_null]
      - name: edinet_code
        description: "EDINETコード。"
        data_tests: [not_null]
      - name: sec_code
        description: "銘柄コード。"
      - name: filer_name
        description: "提出者名。"
      - name: fiscal_year
        description: "第N期の期数。"
        data_tests: [not_null]
      - name: period_type
        description: "annual/half/q1/q2/q3/q4/quarter。"
        data_tests: [not_null]
      - name: period_start
        description: "対象期間の開始日。"
      - name: period_end
        description: "対象期間の終了日。"
      - name: submit_date_time
        description: "書類の提出日時（開示日）。株価と組み合わせる際は決算期末日でなくこちらを基準にする（先読みバイアス回避）。"
      - name: regime
        description: "旧制度/移行期/新制度（cleansed__edinet__report_periods由来）。"
      - name: accounting_standard
        description: "会計基準（DEI「会計基準、DEI」由来。Japan GAAP/IFRS/US GAAP等）。"
      - name: has_consolidated
        description: "連結決算の有無（DEI「連結決算の有無、DEI」由来）。"
      - name: headquarters_address
        description: "本店の所在の場所（cleansed__edinet__headquarters.address_clean由来、2026-10-04追加）。"
      - name: prefecture
        description: "本店所在地の都道府県（cleansed__edinet__headquarters.prefecture由来、2026-10-04追加）。ごく少数(0.1%未満)、提出書類自体の誤記等によりNULL。"
      - name: total_assets
        description: "総資産額。連結優先・個別フォールバック、J-GAAP/IFRS/US GAAPをcoalesce。"
      - name: net_assets
        description: "純資産額（IFRSは親会社所有者帰属持分）。"
      - name: equity_ratio
        description: "自己資本比率。"
      - name: ordinary_income
        description: "経常利益。IFRS/US GAAPに対応概念が無いためそれらの会計基準ではNULL。"
      - name: net_income
        description: "当期純利益（親会社株主に帰属する分を優先、無ければ当期純利益）。"
      - name: sales
        description: "売上高（業種により営業収益・経常収益等の代替項目を含む）。"
      - name: eps
        description: "1株当たり当期純利益（実績、EDINET開示の確定値。会社予想値ではない）。"
      - name: bps
        description: "1株当たり純資産額。"
      - name: roe
        description: "自己資本利益率。"
      - name: per
        description: >
          株価収益率（企業自己申告、経営指標等由来）。実績EPSベースであり、
          かぶたん・Yahoo!ファイナンス等がデフォルト表示する「予想PER」（会社発表の
          進行期業績予想EPSを使用）とは異なる点に注意（詳細はdocs/mart_indicators.md
          参照）。
      - name: operating_cf
        description: "営業活動によるキャッシュ・フロー。"
      - name: investing_cf
        description: "投資活動によるキャッシュ・フロー。"
      - name: financing_cf
        description: "財務活動によるキャッシュ・フロー。"
      - name: capital
        description: "資本金。IFRS/US GAAPに対応項目が無いためそれらの会計基準ではNULL。"
      - name: payout_ratio
        description: "配当性向。IFRS/US GAAPに対応項目が無いためそれらの会計基準ではNULL。"
      - name: shares_outstanding
        description: "発行済株式総数（普通株式）。「株式の総数等」開示由来(dei_facts)を優先し、無ければ経営指標等ベースの会計基準別coalesceにフォールバック。会計基準に依存しない項目（単位: shares）。"
      - name: diluted_eps
        description: "潜在株式調整後1株当たり当期純利益（希薄化後EPS）。"
      - name: comprehensive_income
        description: "包括利益。IFRS/US GAAPは親会社所有者/株主に帰属する分を優先し、無ければ総額にフォールバック。"
      - name: cash_and_equivalents
        description: "現金及び現金同等物の残高。"
      - name: dividend_per_share
        description: "1株当たり配当額。IFRS/US GAAP専用のitem_nameが存在せず3会計基準共通（会計基準に依存しない項目）。"

  - name: mart__jpx_edinet__disclosed_fundamentals
    description: >
      銘柄(jpx_code)×開示(doc_id)ごとの財務指標（毎回フル rebuild、Parquet）。
      mart__edinet__financial_indicatorsに銘柄コード変換(jpx_code)と、決算期末日
      時点の累積調整係数(period_end_cum_adj)を付与した薄い層。株価に依存しない
      値のみを持つ（2026-09-26、mart__jpx_edinet__daily_valuation_indicatorsとの
      責務分離により新設）。
    columns:
      - name: doc_id
        description: "根拠となった書類のID。"
        data_tests: [not_null, unique]
      - name: jpx_code
        description: "銘柄コード（JPX、4桁。sec_codeの先頭4桁）。"
      - name: edinet_code / sec_code / filer_name / fiscal_year / period_type / period_end / submit_date_time
        description: "mart__edinet__financial_indicatorsと同一（詳細はそちらのcolumn定義参照）。"
      - name: eps / bps / sales / shares_outstanding / dividend_per_share
        description: "開示された値そのまま（分割・併合調整前）。mart__edinet__financial_indicatorsと同一。"
      - name: headquarters_address / prefecture
        description: "mart__edinet__financial_indicatorsと同一（詳細はそちらのcolumn定義参照）。"
      - name: period_end_cum_adj
        description: "決算期末日(period_end)時点（以前で直近の取引日）の累積調整係数(権利落ち日基準)。intermediate__jpx__daily_prices_adjusted.cum_adjustment_factorをASOF JOINで取得。EPS/BPS/1株配当の調整に使う。"
      - name: shares_period_end_cum_adj
        description: >
          決算期末日(period_end)時点の累積調整係数(分割・併合の効力発生日
          effective_date基準、2026-10-04追加)。period_end_cum_adjは権利落ち日基準
          のためEPS/BPSには正しいが、発行済株式数は効力発生日基準で調整する必要があり
          (決算期末日がその間に入ると調整漏れが起きる、実データでNTT・KDDI等781件
          確認)、shares_outstanding専用にこちらを使う。
          intermediate__jpx__daily_prices_adjusted.shares_cum_adjustment_factorを
          ASOF JOINで取得。

  - name: mart__jpx_edinet__daily_valuation_indicators
    description: >
      銘柄(jpx_code)×取引日(file_date)ごとの株価評価指標（毎回フル rebuild、
      Parquet）。mart__jpx_edinet__disclosed_fundamentalsとintermediate__jpx__
      daily_prices_adjustedを結合し、株価(close)と連動して日次で変化する指標のみを
      持つ（2026-09-26、開示ベースの値はmart__jpx_edinet__disclosed_fundamentals
      へ分離）。「最新」は単に最終行、決算期末日時点のスナップショットは該当日を
      1行引くだけで得られる（2026-09-25、期grainのmart__jpx_edinet__valuation_
      indicatorsを置き換え）。
    columns:
      - name: jpx_code
        description: "銘柄コード（JPX、4桁）。"
        data_tests: [not_null]
      - name: file_date
        data_tests: [not_null]
      - name: close
        description: "当日の終値（raw、無調整。当日自身の基準なので調整不要）。"
      - name: doc_id
        description: "この取引日時点で「参照可能な最新の開示」と判定された書類のID。fiscal_year/period_type/submit_date_time等の開示メタデータや、eps/bps/sales/shares_outstanding/dividend_per_shareの無調整値が必要な場合はmart__jpx_edinet__disclosed_fundamentalsとdoc_idで結合する。"
      - name: adj_ratio
        description: "決算期末日時点の累積調整係数(権利落ち日基準) ÷ 当該取引日の累積調整係数。分割・併合をまたぐ場合のEPS/BPS換算に使う。またがなければ1.0。"
      - name: shares_adj_ratio
        description: >
          決算期末日時点の累積調整係数(分割・併合の効力発生日基準、
          shares_period_end_cum_adj) ÷ 当該取引日の同基準の累積調整係数
          (shares_file_date_cum_adj)。2026-10-04追加。adj_ratioとは基準日が異なり、
          shares_outstanding_adjusted/market_cap/psrの換算専用。またがなければ1.0。
      - name: eps_adjusted / bps_adjusted
        description: "adj_ratioを掛けて当該取引日の株式数基準に換算したEPS/BPS。"
      - name: shares_outstanding_adjusted
        description: "shares_adj_ratioの逆数を掛けて当該取引日の株式数基準に換算した発行済株式数。"
      - name: pbr
        description: "株価純資産倍率＝close / bps_adjusted。"
      - name: per
        description: >
          実勢PER＝close / eps_adjusted。実績EPSベース（EDINET開示の確定値）。
          かぶたん・Yahoo!ファイナンス等がデフォルト表示する「予想PER」（会社発表の
          進行期業績予想EPSを使用）とは異なる点に注意。実データ検証（2026-09-25、
          3087）ではみんかぶの実績PER表示と一致した。予想EPSはEDINET開示に含まれず
          未対応。
      - name: market_cap
        description: "時価総額＝close × shares_outstanding_adjusted。"
      - name: psr
        description: "株価売上高倍率＝market_cap / sales。"
      - name: earnings_yield
        description: "株式益回り＝eps_adjusted / close（PERの逆数）。perと同じく実績EPSベース。"
      - name: dividend_per_share_adjusted
        description: "adj_ratioを掛けて当該取引日の株式数基準に換算した1株当たり配当額。"
      - name: dividend_yield
        description: "配当利回り＝dividend_per_share_adjusted / close。"

  - name: mart__jpx_edinet__quarterly_fundamentals
    description: >
      EDINET由来(有報/半期報告書)とir-disclosure-dl由来(決算短信)の実績値を1本に
      まとめたmart（毎回フルrebuild、Parquet、2026-10-03新設）。2024年4月の制度
      改正で四半期報告書のEDINET提出が廃止され恒常的にQ1/Q3の空白があること、
      および有報・半期報告書自体のEDINET提出ラグ（実測: 有報は期末後中央値85日、
      半期報告書は44日）を、決算短信（期末後約25〜30日で開示）で埋める。

      行はUNION ALLのみで統合・削除しない（1行=1開示。同じ(edinet_code,
      period_end)にEDINET・ir_disclosure両方の行が存在する場合も両方残る）。
      当初、企業単位でforecast_epsを全行に付与する設計を試みたが、2021年等の
      古いEDINET実績行に2026年開示の予想が付いてしまう先読みバイアスを実機で
      確認し撤回した。forecast_eps/forecast_period_endは、それを実際に記載した
      ir_disclosure由来の行自身にのみ残る。
    columns:
      - name: edinet_code
        description: "EDINETコード。"
        data_tests: [not_null]
      - name: sec_code
        description: "銘柄コード。"
      - name: jpx_code
        description: "銘柄コード（JPX、4桁。sec_codeの先頭4桁）。"
      - name: period_end
        description: "対象期間の終了日。"
        data_tests: [not_null]
      - name: period_type
        description: >
          'annual'/'half'（EDINET側の表記そのまま）、'q1'/'q2_half'/'q3'（決算短信
          側の表記そのまま）。語彙を統一していないため、期間の同一性判定は
          period_type文字列ではなく(edinet_code, period_end)で行うこと。
      - name: source
        description: "'edinet' / 'ir_disclosure'。この行の実績値がどちら由来か。"
        data_tests:
          - accepted_values:
              arguments:
                values: ["edinet", "ir_disclosure"]
      - name: is_preferred_actuals
        description: >
          同じ(edinet_code, period_end)の中で「この期間の確定値として使うべき
          1行」ならtrue（EDINET優先、無ければ開示が最も新しいもの）。期間ごとに
          重複無く1行だけ選びたい場合はwhere is_preferred_actuals で絞ること。
      - name: disclosed_at
        description: >
          開示日時。EDINET由来はsubmit_date_time、ir_disclosure由来はTDnet検知日
          (file_date、時刻粒度は日単位)。株価等と組み合わせる際は先読みバイアス
          回避のためperiod_endでなくこちらを基準にすること。
      - name: eps
        description: "実績EPS。sourceがedinetなら確定値、ir_disclosureなら決算短信の実績値。単位は円/株でsourceによらず共通。"
      - name: sales
        description: >
          売上高（単位は円でsourceによらず共通）。ir_disclosure由来は
          cleansed__ir_disclosure__kessan_tanshin.sales（決算短信の「百万円未満
          切捨て」表記のまま、百万円単位）を1,000,000倍して円に換算している
          （2026-10-04修正、モデルSQL冒頭コメント参照）。
      - name: bps / shares_outstanding / dividend_per_share
        description: "EDINET由来の行のみ値が入る（ir_disclosure由来はNULL、決算短信から構造化していないため）。"
      - name: shares_period_end_cum_adj
        description: >
          発行済株式数の調整専用の累積係数（disclosed_fundamentals由来、EDINET
          由来の行のみ値が入る）。決算期末が株式分割・併合の権利確定日〜効力
          発生日の間に位置する開示では、shares_outstandingは分割前の値を保持
          したままになる。shares_outstanding / shares_period_end_cum_adjで
          「効力発生日以降」基準の株数に変換できる（詳細はdisclosed_fundamentals
          のモデルSQL冒頭コメント参照）。
      - name: forecast_eps
        description: >
          この行(ir_disclosure由来のみ)の決算短信に記載された会社予想EPS
          （EDINETには存在しない値）。非開示の場合NULL。他の行・他の期間への
          転記は行わない（先読みバイアス回避、モデルSQL冒頭コメント参照）。
      - name: forecast_period_end
        description: "forecast_epsが対象とする期間の期末日（この行自身のperiod_endとは異なる、cleansed__ir_disclosure__kessan_tanshin.forecast_period_end参照）。"
