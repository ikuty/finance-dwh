version: 2

sources:
  - name: landing
    description: >
      Prefect の load_edinet タスク（dbt の外）が日付単位で書く Parquet。
      file_fdw の全量スキャン（実測 約12分）を避けるため、レイクの csv.gz を
      日付ごとに1回だけパースして Parquet に落としたもの。dbt からは
      meta.external_location 経由で読む（DuckDB の read_parquet を直接指すので、
      実体のスキーマ・データベースは持たない）。
    tables:
      - name: edinet_csv_facts
        description: "EDINET CSV 明細（縦持ち、全列 text）。file_date=YYYY-MM-DD で日付分割。"
        meta:
          external_location: "read_parquet('{{ env_var('LANDING_ROOT', '/data/landing') }}/edinet_csv_facts/*/part.parquet', hive_partitioning=false)"
      - name: jpx_stq_facts
        description: >
          JPX 形式C（株式相場表・詳細日次）セクション1（立会市場普通取引）の
          銘柄別明細（全列 text）。file_date=YYYY-MM-DD で日付分割。
          load_jpx_stq_prices タスクが Stage1(jpx_stq_pdf)→Stage2(jpx_stq_facts)
          を経て書く（詳細は docs/raw_landing_design.md 参照）。
        meta:
          external_location: "read_parquet('{{ env_var('LANDING_ROOT', '/data/landing') }}/jpx_stq_facts/*/part.parquet', hive_partitioning=false)"
      - name: jpx_monthly_ohlc_facts
        description: >
          JPX 形式B（株式相場表・月次簡易OHLC）の銘柄別明細（全列 text）。
          file_date=YYYY-MM-DD で日付分割（元は1ファイル=1ヶ月だが、
          load_jpx_monthly_ohlc_facts タスクが日付ごとに書き分ける）。
          確定済み過去アーカイブ（2020-01〜、レイク側で一回限りバックフィル済み）。
        meta:
          external_location: "read_parquet('{{ env_var('LANDING_ROOT', '/data/landing') }}/jpx_monthly_ohlc_facts/*/part.parquet', hive_partitioning=false)"
      - name: mufg_stock_splits
        description: >
          三菱UFJ eスマート証券(kabu.com)の株式分割ページ(全列 text)。
          file_date=YYYY-MM-DD で週次スナップショットごとに分割。各週、その時点での
          全履歴を再掲載するため、cleansed側は最新file_dateのみを読む。
        meta:
          external_location: "read_parquet('{{ env_var('LANDING_ROOT', '/data/landing') }}/mufg_stock_splits/*/part.parquet', hive_partitioning=false)"
      - name: mufg_stock_consolidations
        description: "三菱UFJ eスマート証券(kabu.com)の株式併合ページ(全列 text)。mufg_stock_splitsと同じ設計。"
        meta:
          external_location: "read_parquet('{{ env_var('LANDING_ROOT', '/data/landing') }}/mufg_stock_consolidations/*/part.parquet', hive_partitioning=false)"
      - name: mufg_company_name_changes
        description: "三菱UFJ eスマート証券(kabu.com)の商号変更ページ(全列 text)。mufg_stock_splitsと同じ設計。"
        meta:
          external_location: "read_parquet('{{ env_var('LANDING_ROOT', '/data/landing') }}/mufg_company_name_changes/*/part.parquet', hive_partitioning=false)"
