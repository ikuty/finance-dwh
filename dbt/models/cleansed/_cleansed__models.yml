version: 2

models:
  - name: cleansed__edinet__documents
    description: >
      書類一覧インデックスの型付け版（上場会社・REIT・ETFの書類、毎回フル rebuild、Parquet）。
      REITはsec_codeが常にnullのため、form_codeが'07B'/'10B'で始まる書類も対象に含める
      （2026-10-12追加）。ETFもsec_codeが常にnullかつform_codeも判別不能なため、
      edinet_etf_fund_issuers seedとの(edinet_code, fund_code)JOINで対象に含め、
      sec_codeもseed保持のJPX正式コードで補完する（2026-10-17追加）。
    columns:
      - name: doc_id
        data_tests: [not_null, unique]
      - name: file_date
        data_tests: [not_null]
      - name: edinet_code
        data_tests: [not_null]

  - name: cleansed__edinet__facts
    description: >
      EDINET CSV 明細の型付け・名寄せ版（incremental、Parquet）。粒度は
      1行=1書類(doc_id)内の1項目。書類をまたいだ収縮はしない(2026-09-20修正、
      詳細はモデルSQL冒頭コメント参照)。
    columns:
      - name: doc_id
        data_tests: [not_null]
      - name: element_id
        data_tests: [not_null]
      - name: consolidation
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["consolidated", "non_consolidated", "other"]

  - name: cleansed__edinet__report_periods
    description: >
      EDINET提出書類のうち「期」の概念を持つ定期開示（有価証券報告書・四半期報告書・
      半期報告書）を、銘柄×期の単位に正規化した期間ディメンション（毎回フル rebuild、
      Parquet）。粒度はcleansed__edinet__documentsと同じ（1行=1書類）。
    columns:
      - name: doc_id
        description: "書類管理番号（cleansed__edinet__facts.doc_idと結合するキー）。"
        data_tests: [not_null, unique]
      - name: edinet_code
        description: "EDINETコード。"
        data_tests: [not_null]
      - name: sec_code
        description: "銘柄コード。"
      - name: filer_name
        description: "提出者名。"
      - name: filer_category
        description: >
          提出者区分。事業会社は'company'、投資信託受益証券等のファンド型は'fund'
          （ordinance_code='030'により判定）、REIT（投資法人）は'reit'
          （form_codeが'07B'/'10B'で始まる書類、2026-10-12追加。ordinance_code='030'を
          'fund'と共有するため先に判定する）、インフラファンドは'infra_fund'
          （REITとform_codeを共有するため区別できず、edinet_infra_fund_issuers
          seedの確認済みリストで判定、2026-10-13追加。'reit'判定より先に評価する）、
          ETF（上場投資信託）は'etf'（form_codeが他の国内投資信託と完全に共有され
          判別不能のため、edinet_etf_fund_issuers seedの(edinet_code, fund_code)
          複合キーで判定、2026-10-17追加。他のどの区分とも判定順序の衝突が無いため
          最優先で評価する）。
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["company", "fund", "reit", "infra_fund", "etf"]
      - name: fiscal_year
        description: >
          事業年度の期数（doc_descriptionの「第X期」から抽出）。ごく少数、
          doc_descriptionが定型文のみで期数を含まない書類がありNULLになる。
      - name: period_type
        description: >
          対象期間の種別。annual(有価証券報告書)/half(半期報告書)/q1・q2・q3・q4
          (四半期報告書、q4は稀だが実在する。事業年度の期間変更等に伴う変則的な
          四半期区分と見られる)/quarter(号数が特定できない四半期報告書)。
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["annual", "half", "q1", "q2", "q3", "q4", "quarter"]
      - name: period_start
        description: "対象期間の開始日。"
        data_tests: [not_null]
      - name: period_end
        description: "対象期間の終了日。"
        data_tests: [not_null]
      - name: regime
        description: >
          事業会社の開示制度区分。旧制度(四半期報告書あり)/移行期(四半期・半期
          報告書とも無し)/新制度(半期報告書あり)を、同一(edinet_code, fiscal_year)
          内の実際の書類種別の存在有無から判定する。filer_category='fund'/'reit'/
          'infra_fund'/'etf'またはfiscal_yearがNULLの行は常にNULL。
      - name: submit_date_time
        description: "提出日時。"
      - name: doc_type_code
        description: "書類種別コード（生の値、参考）。"
      - name: form_code
        description: "様式コード（生の値、参考）。"
      - name: fund_code
        description: >
          ファンドコード（cleansed__edinet__documents.fund_code、2026-10-18追加）。
          filer_category='etf'の行でのみ非NULL（同一edinet_codeで複数ETFを運用する
          運用会社が存在するため、ETFの銘柄識別にはedinet_codeだけでなくこの列も
          必要。詳細はmart__edinet__etf_financial_indicatorsのコメント参照）。

  - name: cleansed__edinet__headquarters
    description: >
      EDINET開示の表紙記載「本店の所在の場所」を書類(doc_id)単位に取り出し、住所
      文字列から都道府県を分割した型付け版（毎回フル rebuild、Parquet）。粒度は
      1行=1書類（cleansed__edinet__documentsと同じ）。カバレッジは全書類の94%、
      有価証券報告書のみなら99.8%（詳細はモデルSQL冒頭コメント参照）。
    columns:
      - name: doc_id
        description: "書類管理番号。"
        data_tests: [not_null, unique]
      - name: edinet_code
        description: "EDINETコード。"
      - name: address_raw
        description: "本店の所在の場所の原文字列（EDINET開示の表紙記載そのまま）。"
      - name: address_clean
        description: "address_rawから先頭の郵便番号・前後の空白を除去したもの。"
      - name: prefecture
        description: >
          address_cleanの先頭一致から判定した都道府県（47都道府県名、または
          都道府県を省略した市区町村名の固定対応表による）。提出書類自体の誤記や
          住所以外の値が入っているケース(全体の0.1%未満)はNULL(推測で補わない)。

  - name: cleansed__jquants__fin_summary
    description: >
      J-Quants API (GET /v2/fins/summary) の生レスポンスの型付け版（毎回フル
      rebuild、Parquet）。当DWHが独自ロジックで算出した財務指標を第三者データで
      検証する目的専用のモデル(tags=['jquants_validation']、日次のdbt buildからは
      常に除外される）。他のcleansedモデルと異なりlanding層を経由せず、レイクの
      生JSONファイルをDuckDBのread_json_autoで直接読む（検証専用・不定期手動実行
      のためPrefectタスクモジュールを新設しない判断、詳細はモデルSQL冒頭コメント
      参照）。
      粒度は1行=1開示で、同一(code, cur_per_en)に複数行（訂正報告・連結/非連結の
      重複等）が存在しうるが選択ロジックは持たず生のまま残す。どの行を正とするかは
      照合スクリプト側の責務とする。
      codeは5桁（末尾1桁は株式種別、普通株は0）で、DWH側のjpx_code（4桁）と照合
      する際は先頭4桁を使う必要がある（2026-10-06実機確認）。
    columns:
      - name: code
        description: "銘柄コード（5桁、末尾1桁は株式種別）。"
      - name: disc_date
        description: "開示日。"
      - name: disc_time
        description: "開示時刻。"
      - name: doc_type
        description: >
          開示書類の種別（例: FYFinancialStatements_Consolidated_REIT,
          EarnForecastRevision）。EarnForecastRevision等は実績値（sales/eps/bps等）
          の列が全てNULLで、forecast_eps用の行として別途扱う必要がある
          （2026-10-06実機確認）。
      - name: cur_per_type
        description: "当四半期区分（FY/2Q/1Q/3Q等）。"
      - name: cur_per_st / cur_per_en
        description: "当会計期間の開始日・終了日。"
      - name: cur_fy_st / cur_fy_en
        description: "当事業年度の開始日・終了日。"
      - name: sales
        description: "売上高。"
      - name: ordinary_profit
        description: "経常利益。"
      - name: net_profit
        description: "当期純利益。"
      - name: eps
        description: "1株当たり当期純利益。"
      - name: diluted_eps
        description: "潜在株式調整後1株当たり当期純利益。"
      - name: total_assets
        description: "総資産。"
      - name: equity
        description: "純資産。"
      - name: equity_to_asset_ratio
        description: "自己資本比率。"
      - name: bps
        description: "1株当たり純資産。"
      - name: cash_flow_operating / cash_flow_investing / cash_flow_financing
        description: "営業/投資/財務活動によるキャッシュ・フロー。"
      - name: cash_and_equivalents
        description: "現金及び現金同等物期末残高。"
      - name: dividend_per_share_annual
        description: "1株当たり年間配当額（実績）。"
      - name: shares_outstanding
        description: "発行済株式数（期末）。"
      - name: roe
        description: "自己資本利益率。"
      - name: forecast_eps
        description: "会社予想1株当たり当期純利益。"

  - name: cleansed__jpx__stq_prices
    description: >
      JPX 形式C（株式相場表・詳細日次）セクション1（立会市場普通取引）の
      型付け版（毎回フル rebuild、Parquet）。
    columns:
      - name: code
        data_tests: [not_null]
      - name: file_date
        data_tests: [not_null]
      - name: market_segment
        description: "市場区分名（日本語、PDF由来の生の表記）。"
        data_tests:
          - accepted_values:
              arguments:
                values: ["プライム市場", "スタンダード市場", "グロース市場", "TOKYOPROMarket銘柄"]
      - name: market_segment_code
        description: >
          市場区分コード（J-Quants公式MarketCode準拠、seed: jpx_market_segment_code
          からJOINして解決）。
      - name: industry_sector_ja
        description: >
          東証33業種名（日本語）。ファンド型銘柄（内国投資信託受益証券等）はNULL
          （security_category_ja参照）。
      - name: industry_sector_en
        description: "東証33業種名（英語）。ファンド型銘柄はNULL。"
      - name: industry_code_33
        description: >
          東証33業種コード（seed: jpx_industry_33_17からJOINして解決）。ファンド型
          銘柄は「その他業種」ではなく明示的にNULL。
      - name: industry_code_17
        description: >
          TOPIX-17業種コード（seed: jpx_industry_33_17からJOINして解決）。ファンド型
          銘柄はNULL。
      - name: security_category_ja
        description: >
          ファンド型銘柄の証券タイプ区分（内国投資信託受益証券・内国投資証券・
          外国投資証券・出資証券のいずれか）。普通株式の行ではNULL。

  - name: cleansed__jpx__daily_ohlc
    description: >
      JPX 形式B（株式相場表・月次簡易OHLC）の型付け版（毎回フル rebuild、Parquet）。
      「月次簡易OHLC」はソースPDFの配信単位・形式Bの正式名称であり、データの粒度は
      銘柄×営業日（1行=1日）。確定済み過去アーカイブ（2020-01〜、これ以降は
      更新されない）。
    columns:
      - name: code
        data_tests: [not_null]
      - name: file_date
        data_tests: [not_null]

  - name: cleansed__mufg__stock_splits
    description: >
      三菱UFJ eスマート証券(kabu.com)の株式分割ページの型付け版（毎回フル
      rebuild、Parquet、landingの最新file_dateのみ）。個人利用限定
      （services/mufg-corporate-actions/CLAUDE.md参照）。
    columns:
      - name: file_date
        description: "取り込み元のlanding週次スナップショットの日付(常に最新の週)。"
        data_tests: [not_null]
      - name: allotment_date
        description: "割当日。未確定の銘柄は元ページで「－」表記のためNULL。"
      - name: code
        description: "銘柄コード。"
        data_tests: [not_null]
      - name: name
        description: "銘柄名。"
      - name: ratio_raw
        description: '分割比率の原文字列(例 "1：2")。'
      - name: ratio_before
        description: "ratio_rawの分割前株数(全角コロンの左側)。"
      - name: ratio_after
        description: "ratio_rawの分割後株数(全角コロンの右側)。"
      - name: last_cum_rights_date
        description: "権利付最終日。"
      - name: effective_date
        description: "効力発生日。未確定の銘柄は元ページで「－」表記のためNULL。"
      - name: sellable_date
        description: "売却可能予定日。"
      - name: _loaded_at
        description: "DWH取り込み時刻(UTC)。"

  - name: cleansed__mufg__stock_consolidations
    description: >
      三菱UFJ eスマート証券(kabu.com)の株式併合ページの型付け版（毎回フル
      rebuild、Parquet、landingの最新file_dateのみ）。個人利用限定。
    columns:
      - name: file_date
        description: "取り込み元のlanding週次スナップショットの日付(常に最新の週)。"
        data_tests: [not_null]
      - name: effective_date
        description: "効力発生日。"
      - name: code
        description: "銘柄コード。"
        data_tests: [not_null]
      - name: name
        description: "銘柄名。"
      - name: ratio_raw
        description: '併合比率の原文字列(例 "10株→1株")。'
      - name: ratio_before
        description: "ratio_rawの併合前株数。"
      - name: ratio_after
        description: "ratio_rawの併合後株数。"
      - name: last_cum_rights_date
        description: "権利付最終日。"
      - name: _loaded_at
        description: "DWH取り込み時刻(UTC)。"

  - name: cleansed__mufg__company_name_changes
    description: >
      三菱UFJ eスマート証券(kabu.com)の商号変更ページの型付け版（毎回フル
      rebuild、Parquet、landingの最新file_dateのみ）。個人利用限定。
    columns:
      - name: file_date
        description: "取り込み元のlanding週次スナップショットの日付(常に最新の週)。"
        data_tests: [not_null]
      - name: change_date
        description: "商号変更日。"
      - name: code
        description: "銘柄コード。"
        data_tests: [not_null]
      - name: old_name
        description: "変更前の商号。"
      - name: new_name
        description: "変更後の商号。"
      - name: _loaded_at
        description: "DWH取り込み時刻(UTC)。"

  - name: cleansed__ir_disclosure__kessan_tanshin
    description: >
      ir-disclosure-dlが取得する決算短信PDFのサマリー情報の型付け版（毎回フル
      rebuild、Parquet）。disclosure_kind=kessan_tanshinには本体以外のサブタイプ
      （訂正・補足説明資料・期中レビュー完了notice・開示予定日に関するお知らせ）
      が混在するため、extraction_status='ok'（本体として構造化できたもの）に
      絞って利用すること。業績予想セクションは会社が非開示を選んでいる場合
      forecast_*列が全てNULLになる（抽出失敗ではなく正当な非開示、詳細は
      ir_disclosure_kessan_facts.pyのモジュールdocstring参照）。
    columns:
      - name: docid
        description: "JPX上場会社情報サービス側のPDF文書ID（ir-disclosure-dlのraw配下のファイル名）。"
        data_tests: [not_null, unique]
      - name: edinet_code
        description: >
          提出企業のEDINETコード（ir-disclosure-dlのメタデータJSON由来の素通し）。
          mart__jpx_edinet__disclosed_fundamentals等、EDINET由来のmartと企業単位
          で結合するためのキー（2026-10-03追加）。
      - name: sec_code
        description: "証券コード（5桁、EDINETのsec_codeと同じ形式）。"
      - name: extraction_status
        description: "'ok' / 'correction' / 'supplementary' / 'review_notice' / 'schedule_notice'。"
        data_tests:
          - accepted_values:
              arguments:
                values: ["ok", "correction", "supplementary", "review_notice", "schedule_notice"]
      - name: period_type
        description: "'q1' / 'q2_half' / 'q3' / 'annual'。"
      - name: consolidation
        description: "'consolidated' / 'non_consolidated'。"
      - name: accounting_standard
        description: "'jgaap' / 'ifrs' / 'us_gaap'。"
      - name: period_end
        description: >
          期間末日（実日付）。タイトルの決算期末月とperiod_typeから逆算して算出
          （2026-10-03追加、ir_disclosure_kessan_facts.compute_period_end参照）。
          mart__jpx_edinet__disclosed_fundamentals.period_endと同じ意味の列で、
          時系列での整列・結合に使う。月末以外が期末日の変則決算はNULL（既知の制限）。
      - name: ordinary_income
        description: "経常利益(日本基準のみ、IFRS/米国基準はincome_before_taxを参照)。"
      - name: income_before_tax
        description: "税引前利益(IFRS/米国基準のみ)。経常利益と概念が異なるため列を分けている。"
      - name: forecast_eps
        description: "会社予想の通期EPS(本サービスの主目的の値)。非開示の場合NULL。"
      - name: forecast_period_end
        description: >
          forecast_epsが指す対象期間の期末日（当該開示自身のperiod_endとは異なる、
          2026-10-03追加）。四半期決算短信(q1/q2_half/q3)は今期進行中の通期を指すが、
          本決算(annual)は次期の通期を指す（実機確認: クラウディアHD「2026年8月期」
          本体の予想セクションは「2027年8月期の連結業績予想」）。
      - name: _loaded_at
        description: "DWH取り込み時刻(UTC)。"

  - name: cleansed__ir_disclosure__reit_ixbrl_facts
    description: >
      ir-disclosure-dlが取得するREIT(投資法人)決算短信iXBRLの型付け版（毎回フル
      rebuild、Parquet）。粒度は1行=1書類(docid)内の1要素×1context（縦持ち、
      cleansed__edinet__factsと同じ形）。どのcontext_idが「当期の実績」かの解釈は
      ここでは行わない（intermediate層に委ねる、詳細はモデルSQL冒頭コメント参照）。
    columns:
      - name: docid
        description: "JPX上場会社情報サービス側のXBRL文書ID(iXBRLファイル名由来、PDFのdocidとは別の番号体系)。"
        data_tests: [not_null]
      - name: edinet_code
        description: "提出REITのEDINETコード(ir-disclosure-dlのメタデータJSON由来の素通し)。"
        data_tests: [not_null]
      - name: sec_code
        description: "証券コード(ir-disclosure-dlのメタデータJSON由来の素通し)。"
      - name: period_end
        description: >
          決算短信タイトルの「YYYY年M月期」から算出した期間末日（実日付）。
          REITには四半期決算短信が無くタイトルの「期」が開示対象期間そのものを
          指すため、ir_disclosure_kessan_facts.compute_period_endをperiod_type=
          "annual"固定で適用する（詳細はload_ir_disclosure_reit.pyのdocstring参照）。
          intermediate__edinet__reit_financial_facts(Phase 3)がEDINET側の
          period_endと結合するキー。
      - name: element_id
        description: "tse-re-t:タクソノミの要素名(例: 'tse-re-t:NetIncomePerUnitREIT')。"
        data_tests: [not_null]
      - name: context_id
        description: >
          contextRef(例: 'CurrentYearInstant_NonConsolidatedMember_ResultMember'。
          CurrentYear=当期・PriorYear=前期・NextYear/Next2Year=予想、
          ForecastMember/UpperMember/LowerMemberで予想の種類を区別)。
        data_tests: [not_null]
      - name: unit_ref
        description: "unitRef(例: 'JPY'・'JPYPerUnits'・'Units'・'Pure')。"
      - name: value_num
        description: "scale・signを適用済みの実際の値(landing層のir_disclosure_reit_ixbrl.py参照)。値が無い(xsi:nil)場合NULL。"
