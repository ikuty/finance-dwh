version: 2

seeds:
  - name: edinet_infra_fund_issuers
    description: >
      REIT（投資法人）と同じform_code('07B'/'10B')を使うインフラファンド
      （再生可能エネルギー・インフラ資産特化型の投資法人）の一覧
      （2026-10-13、ordinance_code='030'配下の内訳調査で発見）。
      cleansed__edinet__report_periods.filer_categoryの判定はform_codeのみに
      依存していたため、この8社がREITと誤って同一区分('reit')に分類されていた。
      インフラファンドはREITと異なり、決算短信のiXBRLタグが存在しない
      （ir-disclosure-dl側で実機確認済み、1口当たり指標が構造化データとして
      一切取得できない）ため、財務指標の意味が実質的に異なる別グループとして扱う。
      formCode自体では両者を区別できず（実機確認、EDINET DEIタグ「別記事業（個別）、
      DEI」もREIT・インフラファンドとも'inv'で同一）、ファンド名称のテキスト
      パターンも将来の新規上場に対して頑健とは言えないため、個別企業の確認済み
      リストとして管理する。
    config:
      column_types:
        edinet_code: varchar
    columns:
      - name: edinet_code
        description: "対象ファンドのEDINETコード。"
        data_tests: [not_null, unique]
      - name: filer_name
        description: "確認時点の提出者名（参考情報）。"
        data_tests: [not_null]
      - name: note
        description: "該当と判断した根拠の要約（参考情報）。"
        data_tests: [not_null]

  - name: edinet_etf_fund_issuers
    description: >
      EDINETに有価証券報告書等を提出しているETF（上場投資信託）の確認済み一覧
      （2026-10-17追加）。edinet-dl側（services/edinet-dl/seed/
      edinet_etf_fund_issuers.csv）と同じ332件・同じ調査結果（JPX ETF全銘柄一覧
      とファンド名称DEIタグの名寄せ、詳細はedinet-dl側の
      services/edinet-dl/docs/etf_fund_support_design.md参照）。
      REIT/インフラファンドと異なり、ETFのform_codeは他の国内投資信託
      （ETF以外のミューチュアルファンド等）と完全に共有されており
      （実機確認: 07A000/04A000/10A000等、ETF以外も同一コードを使用）、
      form_codeだけでは一切判別できない。また同一edinet_code（運用会社）が
      ETFと非ETFファンドの両方を運用しているケースが3,580件存在するため
      （実機確認）、edinet_code単体（インフラファンドと同じ方式）では判別
      できず、(edinet_code, fund_code)の複合キーが必須。
      sec_codeはEDINETの書類一覧APIが常にnullを返す（REITと同じ問題だが、
      ETFはDEIタグ「証券コード、DEI」も主要運用会社では常に空のため、DEI経由の
      補完もできない。実機確認: 全5,482件中secCode非NULLは0件）ため、
      JPX ETF全銘柄一覧から取得した正式なsec_codeをこのseedに保持し、
      cleansed__edinet__documentsで補完する。
    config:
      column_types:
        edinet_code: varchar
        fund_code: varchar
        sec_code: varchar
    columns:
      - name: edinet_code
        description: "対象ファンドのEDINETコード。"
        data_tests: [not_null]
      - name: fund_code
        description: "対象ファンドのEDINET fundCode。edinet_codeとの複合キーで一意。"
        data_tests: [not_null]
      - name: sec_code
        description: "JPX ETF全銘柄一覧から取得した正式な証券コード（EDINET APIのsecCodeは常にnull）。"
        data_tests: [not_null]
      - name: fund_name
        description: "確認時点のファンド名称（参考情報）。"
        data_tests: [not_null]
      - name: note
        description: "該当と判断した根拠の要約（参考情報）。"
        data_tests: [not_null]

  - name: edinet_sales_operating_revenue_addback
    description: >
      連結の売上高（経営指標等）に加え、裸の営業収入タグ(jppfs_cor:OperatingRevenue2、
      、経営指標等の接尾辞なし)を本業収益として別建てで開示している企業の一覧
      （2026-10-10のJ-Quants比較調査で確認）。該当企業は売上高単独ではJ-Quantsの
      sales（決算短信サマリーの売上高）と一致せず、売上高+営業収入の合計が一致する。
      一方、同じXBRL要素(jppfs_cor:OperatingRevenue2)を持つにもかかわらず、しまむら
      (8227)・エンチョー(8208)は売上高単独がJ-Quantsのsalesと一致し、合算すると
      むしろ不一致になることを実機確認済み。両者の違いをXBRLタグの構造から判別する
      手段がないため（要素ID・コンテキスト・兄弟タグの有無いずれも同一）、個別企業の
      確認済みリストとして管理する。このリストに無い企業は既存の優先順位coalesce
      （売上高を優先）がそのまま適用される。
    config:
      column_types:
        edinet_code: varchar
    columns:
      - name: edinet_code
        description: "対象企業のEDINETコード。"
        data_tests: [not_null, unique]
      - name: filer_name
        description: "確認時点の提出者名（参考情報）。"
        data_tests: [not_null]
      - name: note
        description: "該当と判断した根拠の要約（参考情報）。"
        data_tests: [not_null]

  - name: edinet_eps_bps_implausible_fallback
    description: >
      経営指標等のEPS/BPSタグ自体が桁違いに大きい異常値になる(提出者側のXBRL生成
      ソフト起因と推定、2026-10-11実機確認)企業の一覧。該当企業かつ当該指標が
      `assert_mart__edinet__financial_indicators_eps_bps_plausible`と同じ閾値
      (絶対値100万を超える)の期のみ、net_income(またはnet_assets)を自己株式数を
      除いた発行済株式数で除した近似値に差し替える。4社とも過去の全期間は正常な
      値だったため、無条件の差し替えではなく異常値の期だけに限定する(期中加重
      平均株数ではなく期末株数を使うため完全な値ではなく近似値であることに留意。
      カオナビ(E34712)は期中新株発行の影響でJ-Quants比約2.6%差とやや精度が劣る)。
    config:
      column_types:
        edinet_code: varchar
    columns:
      - name: edinet_code
        description: "対象企業のEDINETコード。"
        data_tests: [not_null, unique]
      - name: filer_name
        description: "確認時点の提出者名（参考情報）。"
        data_tests: [not_null]
      - name: note
        description: "該当と判断した根拠の要約（参考情報）。"
        data_tests: [not_null]

  - name: edinet_sales_sibling_revenue_addback
    description: >
      連結の売上高（経営指標等）に加え、item_nameが「、営業活動による収益」で終わる
      タグ群（不動産賃貸収入・手数料収入等、複数件ありうる）の合計を本業収益として
      別建てで開示している企業の一覧（2026-10-10のJ-Quants比較調査で確認）。
      edinet_sales_operating_revenue_addbackと異なり、この接尾辞は建設・リース・
      運送業等で「売上高の内訳開示」としても広く使われており（既に売上高に含まれる
      ため加算すると二重計上）、全量検証(412文書)で79社の回帰を確認した。タグの
      存在を自動検出の手がかりにするのは危険なため、個別にJ-Quantsとの一致を
      確認済みの企業のみをこのリストで管理する。
    config:
      column_types:
        edinet_code: varchar
    columns:
      - name: edinet_code
        description: "対象企業のEDINETコード。"
        data_tests: [not_null, unique]
      - name: filer_name
        description: "確認時点の提出者名（参考情報）。"
        data_tests: [not_null]
      - name: note
        description: "該当と判断した根拠の要約（参考情報）。"
        data_tests: [not_null]
